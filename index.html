<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Server</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* =========================
           TOP SEARCH
           ========================= */

        #searchArea {
            text-align: center;
            margin-top: 20px;
        }

        #serverIP {
            width: 300px;
            padding: 8px;
            font-size: 18px;
        }

        #checkServer {
            padding: 9px 18px;
            font-size: 18px;
            cursor: pointer;
        }


        /* =========================
           MAIN SERVER AREA
           ========================= */

        #main {
            display: flex;

            width: 1000px;

            margin: 40px auto 0 auto;
        }


        /* =========================
           LEFT SIDE
           ========================= */

        #serverSection {
            width: 500px;

            display: flex;
            align-items: center;
        }

        #serverIcon {
            width: 128px;
            height: 128px;

            image-rendering: pixelated;

            border-radius: 8px;

            background-color: #222222;
        }


        #serverDetails {
            margin-left: 25px;
        }

        #motd {
            font-family: monospace;

            font-size: 26px;
            font-weight: bold;

            line-height: 1.2;
        }

        #motdLine1,
        #motdLine2 {
            margin: 0;
        }

        #players {
            font-size: 18px;
        }


        /* =========================
           REFRESH
           ========================= */

        #rld {
            margin-top: 10px;

            background-color: #00ff00;
            color: #000000;

            font-size: 18px;
            font-weight: bold;

            padding: 8px 18px;

            border: 2px solid #008800;
            border-radius: 6px;

            cursor: pointer;
        }

        #rld:hover {
            background-color: #00cc00;
        }

        #rld:active {
            transform: translateY(2px);
        }


        /* =========================
           RIGHT SIDE
           ========================= */

        #playerSection {
            width: 400px;

            margin-left: 50px;
        }


        #playerHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        #playerHeader h2 {
            margin: 0;
        }


        #playerSearch {
            width: 150px;
            padding: 6px;

            font-size: 14px;
        }


        /* =========================
           PLAYER LIST
           ========================= */

        #playerList {
            margin-top: 15px;
        }


        .player {
            display: flex;
            align-items: center;

            height: 45px;

            margin-bottom: 5px;
        }


        .playerHead {
            width: 40px;
            height: 40px;

            image-rendering: pixelated;

            margin-right: 10px;
        }


        .playerName {
            font-size: 18px;
        }


        /* =========================
           SEE MORE
           ========================= */

        #seeMore {
            margin-top: 10px;

            padding: 8px 15px;

            font-size: 16px;

            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- =========================
         SERVER IP SEARCH
         ========================= -->

    <div id="searchArea">

        <input
            id="serverIP"
            type="text"
            placeholder="Minecraft server IP"
        >

        <button id="checkServer">
            CHECK
        </button>

    </div>



    <!-- =========================
         MAIN
         ========================= -->

    <div id="main">


        <!-- =========================
             SERVER
             ========================= -->

        <div id="serverSection">

            <div>

                <img
                    id="serverIcon"
                    src=""
                    alt="Server Icon"
                >

                <br>

                <button id="rld">
                    ʀᴇꜰʀᴇѕʜ
                </button>

            </div>


            <div id="serverDetails">

                <div id="motd">

                    <p id="motdLine1">
                        Server Info
                    </p>

                    <p id="motdLine2">
                    </p>

                </div>


                <p id="players">
                    Checking...
                </p>

            </div>

        </div>



        <!-- =========================
             PLAYERS
             ========================= -->

        <div id="playerSection">

            <div id="playerHeader">

                <h2>
                    Players
                </h2>

                <input
                    id="playerSearch"
                    type="text"
                    placeholder="Search players"
                >

            </div>


            <div id="playerList">
            </div>


            <button
                id="seeMore"
                style="display: none;"
            >
                See more
            </button>

        </div>

    </div>



    <script>

        console.log("JavaScript started!");


        // =========================
        // ELEMENTS
        // =========================

        let rld =
            document.querySelector("#rld");

        let players =
            document.querySelector("#players");

        let serverIP =
            document.querySelector("#serverIP");

        let checkServer =
            document.querySelector("#checkServer");

        let serverIcon =
            document.querySelector("#serverIcon");

        let motdLine1 =
            document.querySelector("#motdLine1");

        let motdLine2 =
            document.querySelector("#motdLine2");

        let playerList =
            document.querySelector("#playerList");

        let playerSearch =
            document.querySelector("#playerSearch");

        let seeMore =
            document.querySelector("#seeMore");


        // =========================
        // SOUND
        // =========================

        let clickSound =
            new Audio("click1.mp3");


        function playClick() {

            clickSound.currentTime = 0;

            clickSound.play();

        }


        // =========================
        // PLAYER DATA
        // =========================

        let allPlayers = [];

        let showingAll = false;


        // =========================
        // CLEAN MOTD
        // =========================

        function cleanMotd(text) {

            text =
                text.replace(
                    /§[0-9a-fk-or]/gi,
                    ""
                );

            text =
                text.replace(
                    /&[0-9a-fk-or]/gi,
                    ""
                );

            return text;

        }


        // =========================
        // DISPLAY PLAYERS
        // =========================

        function displayPlayers() {

            playerList.innerHTML = "";


            let search =
                playerSearch.value
                    .toLowerCase()
                    .trim();


            let filteredPlayers =
                allPlayers.filter(function(player) {

                    return player.name
                        .toLowerCase()
                        .includes(search);

                });


            let limit = showingAll
                ? filteredPlayers.length
                : 15;


            let visiblePlayers =
                filteredPlayers.slice(
                    0,
                    limit
                );


            visiblePlayers.forEach(
                function(player) {

                    let playerDiv =
                        document.createElement("div");

                    playerDiv.className =
                        "player";


                    let head =
                        document.createElement("img");

                    head.className =
                        "playerHead";


                    /*
                     * MC head image
                     *
                     * Uses the player's UUID
                     */

                    head.src =
                        "https://mc-heads.net/avatar/"
                        + player.uuid
                        + "/40";


                    let name =
                        document.createElement("span");

                    name.className =
                        "playerName";

                    name.textContent =
                        player.name;


                    playerDiv.appendChild(head);

                    playerDiv.appendChild(name);

                    playerList.appendChild(
                        playerDiv
                    );

                }
            );


            /*
             * Show See More only if
             * there are more than 15
             */

            if (
                filteredPlayers.length > 15
                && !showingAll
            ) {

                seeMore.style.display =
                    "block";

            } else {

                seeMore.style.display =
                    "none";

            }

        }


        // =========================
        // GET SERVER
        // =========================

        function getPlayers(ip) {

            players.textContent =
                "Checking...";

            players.style.color =
                "#000000";


            fetch(
                "https://api.mcstatus.io/v2/status/java/"
                + encodeURIComponent(ip)
            )

            .then(function(response) {

                return response.json();

            })

            .then(function(data) {

                console.log(data);


                // =========================
                // ONLINE
                // =========================

                if (data.online) {


                    players.textContent =
                        data.players.online
                        + " players online";


                    players.style.color =
                        "#00ff00";


                    // =========================
                    // ICON
                    // =========================

                    if (data.icon) {

                        serverIcon.src =
                            data.icon;

                    }


                    // =========================
                    // MOTD
                    // =========================

                    if (
                        data.motd
                        && data.motd.clean
                    ) {

                        let motd =
                            cleanMotd(
                                data.motd.clean
                            );


                        let lines =
                            motd.split("\n");


                        motdLine1.textContent =
                            lines[0] || "";


                        motdLine2.textContent =
                            lines[1] || "";

                    }


                    // =========================
                    // PLAYERS
                    // =========================

                    if (
                        data.players
                        && data.players.list
                    ) {

                        allPlayers =
                            data.players.list;

                    } else {

                        allPlayers = [];

                    }


                    showingAll = false;

                    displayPlayers();

                }


                // =========================
                // OFFLINE
                // =========================

                else {

                    players.textContent =
                        "Server offline";

                    players.style.color =
                        "#ff0000";


                    serverIcon.src =
                        "";


                    motdLine1.textContent =
                        ip;


                    motdLine2.textContent =
                        "Server offline";


                    allPlayers = [];

                    displayPlayers();

                }

            })


            .catch(function(error) {

                console.log(
                    "ERROR:",
                    error
                );


                players.textContent =
                    "Could not check server";

                players.style.color =
                    "#ff0000";

            });

        }


        // =========================
        // CHECK SERVER
        // =========================

        checkServer.addEventListener(
            "click",
            function() {

                playClick();


                let ip =
                    serverIP.value.trim();


                if (ip === "") {

                    players.textContent =
                        "Enter a server IP!";

                    players.style.color =
                        "#ff0000";

                    return;

                }


                getPlayers(ip);

            }
        );


        // =========================
        // REFRESH
        // =========================

        rld.addEventListener(
            "click",
            function() {

                playClick();


                let ip =
                    serverIP.value.trim();


                if (ip === "") {

                    ip =
                        "donutsmp.net";

                    serverIP.value =
                        ip;

                }


                getPlayers(ip);

            }
        );


        // =========================
        // ENTER KEY
        // =========================

        serverIP.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    checkServer.click();

                }

            }
        );


        // =========================
        // PLAYER SEARCH
        // =========================

        playerSearch.addEventListener(
            "input",
            function() {

                showingAll = false;

                displayPlayers();

            }
        );


        // =========================
        // SEE MORE
        // =========================

        seeMore.addEventListener(
            "click",
            function() {

                showingAll = true;

                displayPlayers();

            }
        );


        // =========================
        // DEFAULT SERVER
        // =========================

        serverIP.value =
            "donutsmp.net";


        getPlayers(
            "donutsmp.net"
        );

    </script>

</body>
</html>
