<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server</title>

    <style>
        #rld {
            background-color: #00ff00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #008800;
            border-radius: 8px;
            cursor: pointer;
        }

        #rld:hover {
            background-color: #00cc00;
        }

        #rld:active {
            transform: translateY(2px);
        }

        #serverIP {
            font-size: 18px;
            padding: 8px;
            width: 250px;
        }

        #checkServer {
            font-size: 18px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Server Info</h1>

    <p id="players">Checking...</p>

    <button id="rld">RELOAD</button>

    <br><br>

    <!-- Plain box for entering an IP -->
    <input
        type="text"
        id="serverIP"
        placeholder="Minecraft server IP"
    >

    <button id="checkServer">CHECK</button>

    <script>
        console.log("JavaScript started!");

        let rld = document.querySelector("#rld");
        let players = document.querySelector("#players");
        let serverIP = document.querySelector("#serverIP");
        let checkServer = document.querySelector("#checkServer");

        let clickSound = new Audio("click1.mp3");

        function playClick() {
            clickSound.currentTime = 0;
            clickSound.play();
        }

        function getPlayers(ip) {
            players.textContent = "Checking...";
            players.style.color = "#000000";

            fetch("https://api.mcstatus.io/v2/status/java/" + ip)
                .then(response => response.json())
                .then(data => {
                    console.log(data);

                    if (data.online) {
                        players.textContent =
                            data.players.online + " players online";

                        players.style.color = "#00ff00";
                    } else {
                        players.textContent = "Server offline";

                        players.style.color = "#ff0000";
                    }
                })
                .catch(error => {
                    console.log("ERROR:", error);

                    players.textContent = "Could not check server";
                    players.style.color = "#ff0000";
                });
        }

        checkServer.addEventListener("click", function() {
            playClick();

            let ip = serverIP.value.trim();

            if (ip === "") {
                players.textContent = "Enter a server IP!";
                players.style.color = "#ff0000";
                return;
            }

            getPlayers(ip);
        });

        rld.addEventListener("click", function() {
            playClick();

            let ip = serverIP.value.trim();

            if (ip === "") {
                ip = "donutsmp.net";
            }

            getPlayers(ip);
        });

        serverIP.value = "donutsmp.net";

        getPlayers("donutsmp.net");
    </script>

</body>
</html>
