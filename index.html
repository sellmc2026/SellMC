<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server</title>

    <style>
        #rld {
            background-color: #00ff00;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #008800;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 1px 1px 1px #ffffff;
        }

        #rld:hover {
            background-color: #00cc00;
        }

        #rld:active {
            transform: translateY(2px);
        }

        #serverIP {
            font-size: 18px;
            padding: 10px;
            width: 250px;
        }

        #search {
            font-size: 18px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Server Info</h1>

    <p id="players">Checking...</p>

    <button id="rld">RELOAD</button>

    <br><br>

    <input
        id="serverIP"
        type="text"
        placeholder="Enter Minecraft server IP"
    >

    <button id="search">SEARCH</button>

    <script>
        console.log("JavaScript started!");

        let rld = document.querySelector("#rld");
        let players = document.querySelector("#players");

        let serverIP = document.querySelector("#serverIP");
        let search = document.querySelector("#search");

        let clickSound = new Audio("click1.mp3");

        function playClick() {
            clickSound.currentTime = 0;
            clickSound.play();
        }

        function getPlayers(ip) {
            players.textContent = "Checking...";
            players.style.color = "#ffffff";

            fetch("https://api.mcstatus.io/v2/status/java/" + ip)
                .then(response => response.json())
                .then(data => {
                    console.log(data);

                    if (data.online) {
                        players.textContent =
                            data.players.online + " players online";

                        players.style.color = "#00ff00";
                    } else {
                        players.textContent = "Server offline";

                        players.style.color = "#ff0000";
                    }
                })
                .catch(error => {
                    console.log("ERROR:", error);

                    players.textContent = "Could not check server";
                    players.style.color = "#ff0000";
                });
        }

        rld.addEventListener("click", function() {
            console.log("RELOAD CLICKED!");

            playClick();

            // Reload the current server
            getPlayers(serverIP.value);
        });

        search.addEventListener("click", function() {
            console.log("SEARCH CLICKED!");

            playClick();

            let ip = serverIP.value;

            if (ip === "") {
                players.textContent = "Enter a server IP!";
                players.style.color = "#ff0000";
                return;
            }

            getPlayers(ip);
        });

        // Initial server
        serverIP.value = "donutsmp.net";
        getPlayers("donutsmp.net");
    </script>

</body>
</html>
